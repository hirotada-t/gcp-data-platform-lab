name: Deploy Meta Ads Job

on:
  push:
    branches:
      - main
    paths:
      - "jobs/meta-ads/**"
      - ".github/workflows/meta-ads-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gcp-test-504808
  REGION: asia-northeast1
  REPOSITORY: platform-jobs
  IMAGE_NAME: meta-ads
  JOB_NAME: meta-ads-job

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/18325870326/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@gcp-test-504808.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        working-directory: jobs/meta-ads
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

          gcloud builds submit . \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --tag="${IMAGE_URI}" \
            --suppress-logs

      - name: Update Cloud Run Job image
        run: |
          gcloud run jobs update "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_URI}"